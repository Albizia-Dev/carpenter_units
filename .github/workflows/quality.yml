name: Quality

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format-test:
    name: Format churn test once
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format churn test
        run: dart format test/carpenter_units_test.dart

      - name: Discard dependency-tool side effects
        shell: bash
        run: |
          git restore analysis_options.yaml 2>/dev/null || true
          git restore example/pubspec.lock 2>/dev/null || true

      - name: Guard scope
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "test/carpenter_units_test.dart"

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/carpenter_units_test.dart
          git commit -m "style: format unit consumer churn test"
          git push
